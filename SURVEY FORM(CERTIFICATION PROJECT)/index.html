<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<title>Survey Form</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="noob">
<h1 id="title">FreeCodeCamp Survey Form</h1>
<p id="description">Thank you for taking the time to help us improve the platform</p>
</div>
<div class="main">
<form id="survey-form">
<fieldset>
    <label id="name-label">Name 
        <input required id="name" type="text" placeholder="Enter your name"></label>
    <label id="email-label">Email 
        <input required id="email" type="email" placeholder="Enter your email"></label>
        <label id="number-label">Age(optional)
        <input id="number" type="number" placeholder="Enter your age" min="13" max="120"></label>
</fieldset> 
<fieldset>
        <label for="role">Which option best describes your current role?
        <select id="dropdown">

            <option value="">Select current role</option>
            <option value="1">Student</option>
            <option value="2">Full time job</option>
        </select>
        </label>
</fieldset>

<fieldset>
    <label>Would you recommend freeCodeCamp to a friend?</label>
    <label><input class='inline' type="radio" name="first" value="definitely">Definitely</label>
    <label><input class='inline' type="radio" value="maybe" name="first">Maybe</label>
    <label><input class='inline' type="radio" value="sure" name="first">Not sure</label>
    <label><input class='inline' type="radio" value="def_not" name="first">Definitely not</label>

</fieldset>

<fieldset>
    <label>What would you like to see improved (Check all that apply)</label>
    <label><input class='inline' type="checkbox" value="front"> Front-end Projects</label>
    <label><input class='inline' type="checkbox" value="back"> Back-end Projects</label>
    <label><input class='inline' type="checkbox" value="data"> Data Visualization</label>
</fieldset>

<fieldset>
<label>Any comments or suggestions?</label>
<textarea placeholder="Enter your comments here...">

</textarea>
</fieldset>
<div class="submitting">
<input value='Submit' id="submit" type="submit">
</div>
</form>
</div>
</body>
</html>
